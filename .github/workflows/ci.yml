name: ci
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Recounts the committed Kaggle repeat runs and fails if the README
      # quotes different numbers. No network needed.
      - name: README matches the repeat runs
        run: python -m azbench.kaggle_repeats check
      - name: Tests
        run: pip install datasets pytest && python -m pytest tests/ -q
